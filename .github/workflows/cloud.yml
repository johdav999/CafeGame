name: Cloud environment
on:
  push:
    paths: ['tools/cloud/**', 'tools/serve.mjs', 'tools/browser-smoke.cjs', '.emscripten-version', 'CMakeLists.txt', '.github/workflows/cloud.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CAFE_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash -n tools/cloud/setup.sh tools/cloud/run.sh tools/cloud/check.sh
      - run: bash tools/cloud/setup.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-validation
          path: |
            build/evidence
            build/cloud/server.log
