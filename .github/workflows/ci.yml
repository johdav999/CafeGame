name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tools-and-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: g++ -std=c++20 -Wall -Wextra -Werror -Isrc tests/simulation_test.cpp -o /tmp/cafe-test && /tmp/cafe-test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.11'
          actions-cache-folder: emsdk-cache
      - run: emcmake cmake -S . -B build/browser -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/browser --target cafe_game -j 4
      - uses: actions/upload-artifact@v4
        with:
          name: cafe-game-browser
          path: build/browser/site
          if-no-files-found: error
